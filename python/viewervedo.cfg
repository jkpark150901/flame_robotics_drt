{
    "window_size": [
        2560,
        1840
    ],
    "background_color": [
        1.0,
        1.0,
        1.0
    ],
    "display_options": {
        "depth_peeling": false,
        "show_fps": true,
        "show_c_space": true,
        "show_only_failed_ik_poses": true,
        // 스냅샷을 불러올 때 저장된 IK 목표 자세(ik_goal_q)를 반투명 로봇으로 표시 (Viewer F8 / SimTool "Show saved IK"로 on/off)
        "show_saved_ik_goals": true
    },
    "logging": {
        "level": "DEBUG",
        "console_level": "INFO",
        "enable_file": true,
        "file_level": "DEBUG",
        "log_dir": "logs/viewervedo"
    },
    "c_space_bound": [
        8.5,
        5.0,
        3.7
    ],
    "urdf": [
        {
            "name": "positioner",
            "path": "urdf/positioner.urdf",
            "base": [
                4.0,
                2.5,
                0.0,
                0,
                0,
                0
            ]
        },
        {
            "name": "dda_rb10_1300e",
            "path": "urdf/rb10_1300e_DDA.urdf",
            "base": [
                4.0,
                2.5,
                0.0,
                0,
                0,
                0
            ]
        },
        {
            "name": "rb20_1900es",
            "path": "urdf/rb20_1900es_RT.urdf",
            "base": [
                4.0,
                2.5,
                0.0,
                0,
                0,
                0
            ]
        }
    ],
    "n_io_context": 10,
    "zapi": {
        "transport": "tcp",
        "channel": "127.0.0.1",
        "port": 5556
    },
    "robot_core_service": {
        "mode": "embedded",
        "transport": "tcp",
        "channel": "127.0.0.1",
        "port": 5557,
        "shutdown_hotkey": "F12"
    },
    "font_path": "python/resource/NanumSquareR.ttf",
    "spool_load": {
        "pcd_scale": 0.001,
        "ply_scale": 1.0,
        "normal_scale": 1.0,
        // downsample_keep_ratio: fraction of the points kept on load (0.1 = every 10th point) for the display and the
        // collision point cloud; *_max_points 0 = no extra cap; noise_filter off
        "downsample_keep_ratio": 0.1,
        "visual_max_points": 50000,
        "noise_filter": {
            "enabled": false,
            "method": "ccl",
            "level": 7,
            "min_points": 30
        },
        "collision_max_points": 0,
        "probe_collision_on_update": false
    },
    "ef_pose": {
        "frames": {
            "dda": {
                "end_link": "dda_link_end",
                "tcp_joint": "dda_joint_end",
                "pipe_facing_axis": [
                    0.0,
                    0.0,
                    1.0
                ],
                "pipe_parallel_axis": [
                    -1.0,
                    0.0,
                    0.0
                ]
            },
            "rt": {
                "end_link": "rt_link_end",
                "tcp_joint": "rt_joint_end",
                "pipe_facing_axis": [
                    0.0,
                    0.0,
                    1.0
                ],
                "roll_about_facing_deg": 90.0
            }
        },
        "pipe_profile": {
            "method": "ransac",
            "seed": 0,
            "normal_sampling_size": 0.01,
            "neighborhood_radius": 0.25,
            "max_neighborhood_points": 30000,
            "radius_min": 0.01,
            "radius_max": 0.30,
            "ransac_iterations": 400,
            "inlier_threshold": 0.003,
            "normal_angle_deg": 25.0,
            "min_axis_angle_deg": 8.0,
            "refine": true,
            "min_inliers": 100,
            "min_inlier_ratio": 0.05,
            "min_angular_coverage_deg": 90.0,
            "anchor_tolerance": 0.01,
            "max_radius_mismatch": 0.3,
            "validate": true,
            "cluster_roi_radius": 0.005,
            "cluster_height_range": [
                -0.1,
                0.3
            ],
            "sphere_radius_offset": 0.003
        },
        "num_candidates": 9,
        "distance_from_dda_to_surface": 0.01,
        "distance_from_dda_to_rt": 0.3,
        "angle_of_rt": 10.0,
        "force_90_fallback": false,
        "debug_mode": true
    },
    "chuck_mount_profile": {
        "distance_threshold": 0.05,
        "min_points": 20
    },
    "chuck_mount": {
        "f_column": {
            "center_offset": [
                0.665,
