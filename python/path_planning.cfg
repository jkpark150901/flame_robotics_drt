{
    // q-space path planner(rrt_connect/rrt_star 등) 및 IK solver 설정.
    // viewervedo.cfg와 같은 폴더에서 자동으로 병합되어 로드된다(viewervedo.py 참고).
    "path_planning": {
        "ik_max_iter": 100000,
        "ik_tol": 1e-4,
        "ik_damping": 1e-3,
        "ik_dt": 0.2,
        "ik_position_only_tol": 0.01,
        "positioner_second_group_r_deg": 180.0,
        // q-space RRT*에서 target link의 FK world position을 start/goal pose 기준
        // bounds(offset 포함)로 제한할지 여부. 기본 false(기존 동작 그대로, 제한 없음).
        "enable_workspace_check": false,
        // start/goal pose를 포함하는 최소 AABB에서, world 좌표계 x/y/z 축으로
        // 각각 얼마나 더 확장할지(미터 단위) 수동 설정. enable_workspace_check가
        // true일 때만 사용됨.
        "workspace_check_offset": {"x": 0.5, "y": 0.5, "z": 0.5},
        // ef pose(목표 지점)를 아래 고정 world 영역 안으로 제한한다. true이면 이 박스 밖의
        // ef pose는 계획하지 않고 out_of_workspace로 실패 처리한다. 기본 false(제한 없음).
        // 기본값은 viewervedo.cfg의 c_space_bound([8.3, 3.7, 3.0]) 기준으로, c-space 박스가
        // 각 축 원점부터 그 값까지 뻗으므로 [0, bound] 범위로 넣었다.
        "enable_ef_pose_workspace_limit": false,
        "ef_pose_workspace_bounds": {
            "x_min": 0.0, "x_max": 8.3,
            "y_min": 0.0, "y_max": 3.7,
            "z_min": 0.0, "z_max": 3.0
        }
    },
    "inspection_ik": {
        "solver": "pybullet",
        "qp_solver": "quadprog"
    }
}
