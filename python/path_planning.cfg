{
    // q-space path planner(rrt_connect/rrt_star 등) 및 IK solver 설정.
    // viewervedo.cfg와 같은 폴더에서 자동으로 병합되어 로드된다(viewervedo.py 참고).
    "path_planning": {
        // Joint interpolation audit and bounded local replanning before acceptance/playback.
        "simulation_collision_resolution": 0.005,
        "simulation_max_repairs": 3,
        "ik_max_iter": 100000,
        "ik_tol": 1e-4,
        "ik_damping": 1e-3,
        "ik_dt": 0.2,
        "ik_position_only_tol": 0.01,
        "positioner_second_group_r_deg": 180.0,
        // IK 첫 초기값의 carriage는 0m에 둔다. 목표 방향과 무관하며, 이후 IK 탐색에서는 자유롭게 움직일 수 있다.
        "seed_carriage_near_zero": true,
        // 계획 순서: (1) 회전 없이 닿는 그룹을 x 오름차순으로 차례대로 계획 -> (2) 끝까지 갔으면 포지셔너 회전 직전에 모든 로봇을 포지셔너에서 떨어진
        // 자세로 복귀(linear track x 위치는 유지, carriage와 팔 관절은 초기값 0) -> (3) 포지셔너 회전 -> (4) 나머지 그룹을 x 내림차순(역순)으로 계획.
        // true(기본): 위 (2) 복귀를 한다. false: 복귀 없이 마지막 목표 자세에서 바로 회전/계획. 목표 자세 사이(같은 단계 안)에서는 어느 쪽이든 초기화하지 않는다.
        "reset_pose_before_rotation": true,
        // 접근/복귀는 RT -> DDA 순차 실행. 상대 로봇 현재 자세를 충돌 검사에 포함한다.
        "playback_robot_order": "planning_order",
        // 플레이백 중 매 프레임 충돌 검사(현재 배관/포지셔너 기준): 충돌 중인 링크/장애물만 빨간색. 계획 실패 목표는
        // 시작 -> IK 목표 직선 이동으로 재생한다.
        "playback_live_collision_check": true,
        // 플레이백 속도 제한 (평가 지표 T_motion 과 같은 프로파일): 구간마다 최대 변위 관절 기준, 경로 전체 사다리꼴.
        // 회전 축 deg/s, deg/s^2 / 직동 축(리니어 트랙, 캐리지) m/s, m/s^2. SimTool 재생 속도 = 시간 배율(1.0 = 실시간)
        "playback_velocity_limits": {"enabled": true, "joint_vel_deg": 50.0, "joint_acc_deg": 30.0,
                                     "lin_vel": 0.5, "lin_acc": 0.3},
        // q-space RRT*에서 target link의 FK world position을 start/goal pose 기준
        // bounds(offset 포함)로 제한할지 여부. 기본 false(기존 동작 그대로, 제한 없음).
        // 가상 벽: 배관 축 너머(로봇 반대편)를 얇은 상자 장애물로 막아, 팔이 배관을 넘어 반대편에서 접근하는 해/경로를 충돌로 처리한다.
        // margin: 배관 축에서 벽까지 거리(m, 배관 반지름보다 커야 함), width: 벽 두께(m).
        // 로봇 팔 링크/엔드이펙터가 C-space 박스(viewervedo.cfg c_space_bound, 원점 0) 밖으로 나가면 충돌로 처리
        // (경로 계획 상태 검사, 시작/목표, 검증, collision-free IK, 플레이백 충돌 표시 공통). margin: 박스 안쪽 여유(m)
        "cspace_check": {"enabled": true, "margin": 0.0},
        "robot_side_wall": {"enabled": true, "margin": 0.25, "width": 1.2},
        "enable_workspace_check": false,
        // start/goal pose를 포함하는 최소 AABB에서, world 좌표계 x/y/z 축으로
        // 각각 얼마나 더 확장할지(미터 단위) 수동 설정. enable_workspace_check가
        // true일 때만 사용됨.
        "workspace_check_offset": {"x": 0.5, "y": 0.5, "z": 0.5},
        // ef pose(목표 지점)를 아래 고정 world 영역 안으로 제한한다. true이면 이 박스 밖의
        // ef pose는 계획하지 않고 out_of_workspace로 실패 처리한다. 기본 false(제한 없음).
        // 기본값은 viewervedo.cfg의 c_space_bound([8.5, 5.0, 3.7]) 기준으로, c-space 박스가
        // 각 축 원점부터 그 값까지 뻗으므로 [0, bound] 범위로 넣었다.
        "enable_ef_pose_workspace_limit": false,
        "ef_pose_workspace_bounds": {
            "x_min": 0.0, "x_max": 8.5,
            "y_min": 0.0, "y_max": 5.0,
            "z_min": 0.0, "z_max": 3.7
        },
        // DDA는 배관 표면에 수직으로만 진입한다. 실제 DDA에는 깊이 카메라가 있어 진입 방향(수직)의
        // 충돌은 카메라로 검증할 수 있지만, 그 밖의 방향에서 표면에 붙어 지나가는 경로는 검증할 수단이 없다.
        // 경로 = [retreat] + [free] + [approach]
        //   approach: 사전접근점 -> 목표, facing 축 방향 직선(여기서만 표면 근처 허용)
        //   free:     그 외 구간. clearance_links가 표면에서 min_clearance 안으로 못 들어간다.
        //   retreat:  시작 자세가 표면 근처면(직전 target 진입 자세를 이어받은 경우) facing 반대로 먼저 물러남.
        // facing 축/끝 링크는 viewervedo.cfg의 ef_pose.frames.dda에서 가져온다(자세 결정과 같은 값).
        "dda_approach": {
            "enabled": false,  // 사전접근 비활성: 목표 자세(IK 해)까지 바로 계획한다. true면 standoff 지점 -> 목표 직선 접근을 사용
            "robot_name_contains": "dda",
            "standoff": 0.15,        // 사전접근점: 목표에서 facing 반대로 이만큼(m)
            "min_clearance": 0.10,   // free 구간에서 clearance_links가 지켜야 할 표면 거리(m). standoff보다 작아야 함
            "step": 0.02,            // 직선 구간 IK 보간 간격(m)
            "max_joint_step": 0.3    // 보간점 사이 q 변화가 이보다 크면 IK 해 가지가 바뀐 것으로 보고 실패 처리
        }
    },
    "inspection_ik": {
        "solver": "collision_free",   // pybullet | dls | qp | collision_free(충돌 없는 IK: 다중 시드 + 영공간 보정, 아래 파라미터 사용)
        "qp_solver": "quadprog",
        // [collision_free solver] 목표 자세 IK를 여러 시드(multi_start개)에서 풀고 충돌 없는 해 중 장애물에서 가장 먼 해를 쓴다.
        // clearance_cap: 이 거리 이상이면 "충분히 멀다"로 보고 동률 처리(동률이면 시작 q에 가까운 해), time_budget: 목표당 최대 탐색 시간(s).
        "multi_start": 16,
        "multi_start_clearance_cap": 0.5,
        "multi_start_time_budget": 8.0,
        // 시드당 PyBullet IK 반복 수 상한 (UI max_iter 100000이면 시드 하나에 수 초 걸려 예산 안에 3~4개만 돌았음)
        "multi_start_max_iter": 2000,
        // 충돌 없는 해가 하나도 없으면(goal_collision 직전) 재시도: 라운드마다 시드 추가 + 리니어 트랙 탐색 폭 확대
        // (0.6 m -> 1.2 m -> 레일 전체 균등 분포 "rail") + 보정. 충돌 없는 해가 나오면 즉시 중단. 값은 라운드별 리스트.
        // 목표 자세 선택: "nearest" = 충돌 없고 여유거리 >= ik_goal_min_clearance(기본 clearance_safe) 인 해 중 시작 자세와
        // 관절 거리(관절 범위로 정규화, ik_goal_joint_weights 가중)가 가장 가까운 해. "clearance" = 여유거리 최대(예전 방식)
        "ik_goal_selection": "nearest",
        "ik_goal_min_clearance": -1.0, // 충돌 없는 후보 전부에서 시작 자세와 가까운 해 선택; 여유거리 재탐색 없음
        "ik_goal_joint_weights": {"base": 2.0, "wrist3": 2.0, "carriage": 3.0},
        // 선택된 목표 자세를 TCP 포즈를 유지한 채(포즈 Jacobian 영공간) APF 로 장애물에서 멀어지게 조정한다.
        // DDA(센서)-배관 쌍과 TCP 고정 시 움직일 수 없는 링크(손목 등)는 제외, 나머지 링크-장애물 쌍 U = 0.5*eta*(1/d - 1/d0)^2.
        // 충돌 없음/로봇 쪽 유지 확인 후 채택. d0: 목표 자세에서 밀어내기 시작하는 거리(m, 경로 최적화 d0 0.15보다 넓게)
        "ik_goal_apf_refine": false, // 목표 자세의 여유거리 확대 보정 생략
        "ik_goal_apf_d0": 0.3,
        "ik_goal_apf_eta": 1.0,
        "ik_goal_apf_step": 0.05,
        "ik_goal_apf_max_iter": 40,
        "ik_goal_apf_time_budget": 3.0,
        "collision_free_retry_rounds": 3,
        "collision_free_retry_seeds": [32, 48, 128],
        "collision_free_retry_time_budget": [8.0, 10.0, 30.0],
        "collision_free_retry_track_jitter": [0.6, 1.2, "rail"],
        "multi_start_seed": 0,
        // 비충돌 해가 하나도 없을 때만 충돌 후보를 영공간에서 보정한다. 작은 양의 여유거리만으로는 보정하지 않는다.
        "collision_free_refine": true,
        "clearance_safe": 0.03,
        "self_clearance": 0.01,
        "sensor_min_distance": 0.003,
        "refine_top_k": 4,
        "refine_time_budget": 4.0,
        // 충돌 없는 해 중 팔이 로봇 쪽(배관 축 기준)에 머무는 해만 우선 사용한다. side_margin: 배관 축 너머로 허용하는 거리(m)
        "keep_robot_side": true,
        "side_margin": 0.25
    }
}
